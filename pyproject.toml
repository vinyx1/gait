[project]
name = "gait"
version = "0.1.0"
description = "Explain municipal decisions in plain language and show who they affect"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1", "pypdf>=5", "anthropic>=1", "python-multipart>=0.0.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["gait"]
